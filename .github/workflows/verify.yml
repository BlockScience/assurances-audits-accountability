name: Verify Documents

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  verify-documents:
    name: Verify Changed Documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e .

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            00_vertices/**/*.md
            01_edges/**/*.md
            02_faces/**/*.md

      - name: Verify changed documents
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Verifying changed documents..."
          failed=0
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" == *"README.md" ]]; then
              echo "Skipping: $file"
              continue
            fi
            echo "Verifying: $file"
            if ! aaa verify "$file"; then
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "ERROR: One or more documents failed verification"
            exit 1
          fi
          echo "All changed documents passed verification"

  build-and-audit:
    name: Build & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e .

      - name: Build RDF graph
        run: aaa build

      - name: Audit assurance charts
        run: |
          for chart_dir in charts/*/; do
            chart_name=$(basename "$chart_dir")
            chart_file="$chart_dir$chart_name.md"
            if [ -f "$chart_file" ]; then
              if grep -q "^type: chart/assurance_audit" "$chart_file" 2>/dev/null; then
                echo "Auditing: $chart_file"
                aaa audit "$chart_dir" || true
              fi
            fi
          done

  check:
    name: Topological Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e .

      - name: Build graph
        run: aaa build

      - name: Check topology
        run: |
          for chart_dir in charts/*/; do
            chart_name=$(basename "$chart_dir")
            chart_file="$chart_dir$chart_name.md"
            if [ -f "$chart_file" ]; then
              echo "Checking topology: $chart_file"
              aaa check topology "$chart_file" || true
            fi
          done

  summary:
    name: Verification Summary
    needs: [verify-documents, build-and-audit, check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Verification Summary"
          echo "===================="
          echo "  verify-documents: ${{ needs.verify-documents.result }}"
          echo "  build-and-audit: ${{ needs.build-and-audit.result }}"
          echo "  check: ${{ needs.check.result }}"

          if [[ "${{ needs.verify-documents.result }}" == "failure" ]] || \
             [[ "${{ needs.build-and-audit.result }}" == "failure" ]] || \
             [[ "${{ needs.check.result }}" == "failure" ]]; then
            echo "ERROR: One or more verification jobs failed"
            exit 1
          fi
          echo "All verification jobs passed"
