name: Validate Accountability

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  check-accountability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e .

      - name: Check accountability
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: aaa check accountability || true

      - name: Comment on PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Accountability Check Failed\n\nThis PR modifies validation edge(s), but the commit was not made by the accountable party listed in the frontmatter.\n\nSee the workflow logs for details.`
            })
