name: Assurance Audit

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run audit tests
        run: pytest tests/test_audit.py -v

      - name: Build graph
        run: aaa build examples/paper-authoring/content/ --output graph.ttl

      - name: Audit all assurance charts
        run: |
          charts=$(find charts -name "*.md" -type f 2>/dev/null || true)
          if [ -z "$charts" ]; then
            echo "No charts found"
            exit 0
          fi

          failed=""
          passed=""
          for chart in $charts; do
            if grep -q "^type: chart/assurance_audit" "$chart" 2>/dev/null; then
              chart_dir=$(dirname "$chart")
              echo "Auditing: $chart"
              if aaa audit "$chart_dir"; then
                passed="$passed\n- $chart"
              else
                failed="$failed\n- $chart"
              fi
            fi
          done

          if [ -n "$failed" ]; then
            echo ""
            echo "Failed charts:"
            echo -e "$failed"
            exit 1
          fi
          echo "All assurance charts passed"
