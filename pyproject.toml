[project]
name = "aaa-docware"
version = "1.0.0"
description = "Typed simplicial complex framework for document verification, validation, and assurance"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Michael Zargham" }
]
keywords = ["systems-engineering", "verification", "validation", "assurance", "simplicial-complex", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "pydantic>=2.0",
    "knowledgecomplex>=0.1.0",
]

[project.scripts]
aaa = "aaa.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
docs = [
    "mkdocs-material>=9.0",
]

[project.urls]
Homepage = "https://github.com/BlockScience/assurances-audits-accountability"
Documentation = "https://blockscience.github.io/assurances-audits-accountability/"
Changelog = "https://github.com/BlockScience/assurances-audits-accountability/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aaa"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = [
    "src/aaa/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-p no:ethereum"

[dependency-groups]
dev = [
    "hatch>=1.16.5",
    "mkdocs-material>=9.7.6",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
